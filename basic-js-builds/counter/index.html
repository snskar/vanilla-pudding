<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="screen-splash">
            <div class="header-content">
            <div id="title"><b>Counter Build</b></div>
            <div id="subtitle">This is a basic JS counter</div>
            <div id="counter-text">The current count is <span id="count-span">count</span></div>
        </div>
        <div class="buttons-container">
            <div class="button-container">
                <div class="click-disclaimer">Increase</div>
                <div class="button-box"id="increment-button">
                    <img src="add.png" alt = "Increment Counter">
                </div>
            </div>
            <div class="button-container">
                <div class="click-disclaimer">Decrease</div>
                <div class="button-box" id="decrement-button">
                    <img src="minus-sign.png" alt = "Decrement Counter">
                </div>
            </div>
            <div class="button-container">
                <div class="click-disclaimer">Refresh</div>
                <div class="button-box" id="refresh-button">
                    <img src="loop-arrow.png" alt="Refresh Counter">
                </div>
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
