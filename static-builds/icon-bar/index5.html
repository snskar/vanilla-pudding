<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Bar 5</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <div class="icon-bar-container">
        <div class="icon-bar">
            <div class="icon-container">
                <img src="return.png" alt="Back button">
                <span>Back</span>
            </div>
            <div class="icon-container">
                <img src="home.png" alt="Home button">
                <span>Home</span>
            </div>
            <div class="icon-container">
                <img src="edit.png" alt="Edit button">
                <span>Edit</span>
            </div>
        </div>
    </div>
    
</body>
</html>
