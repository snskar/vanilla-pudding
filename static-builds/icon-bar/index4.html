<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Bar Static Build</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <div class="page-container">
        <div class="screen-mock">
            <div class="icon-bar">
                <div class="icon-container">
                    <img src="return.png" alt="back button">
                    <span>Back<span>
                </div>
                <div class="icon-container">
                    <img src="home.png" alt="home button">
                    <span>Home<span>
                </div>
                <div class="icon-container">
                    <img src="messenger.png" alt="message button">
                    <span>Message<span>
                </div>
                <div class="icon-container">
                    <img src="edit.png" alt="edit button">
                    <span>Edit<span>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
