<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Bar 2</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="page-container">
        <div class="mock-screen">
            <div class="icon-bar">

                <div class="icon-container">
                    <img src="./return.png" alt="Back button">
                    <span>Back</span>
                </div>

                <div class="icon-container" alt="Home Button">
                    <img src="./home.png">
                    <span>Home</span>
                </div>

                <div class="icon-container" alt="Message button">
                    <img src="./messenger.png">
                    <span>Message</span>
                </div>

                <div class="icon-container">
                    <img src="./edit.png" alt="Edit button">
                    <span>Edit</span>
                </div>


            </div>
        </div>
    </div>
    
</body>
</html>
